name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.REGISTRY_URL }}/bimvietsolutions/bnsc_02_webbnsc
  APP_CONTAINER: bnsc_demobnsc_app
  APP_ENV_FILE: /home/deploy_demobnsc/app/.env
  APP_NETWORK: pgnet
  # Thư mục dữ liệu lúc chạy trên VPS: ảnh bài viết cũ (~2,8 GB) + ảnh admin
  # upload. Mount vào /app/public/uploads trong container.
  APP_UPLOAD_DIR: /home/deploy_demobnsc/app/uploads

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build application
        run: npm run build

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Log in to private registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy immutable image over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          APP_CONTAINER: ${{ env.APP_CONTAINER }}
          APP_ENV_FILE: ${{ env.APP_ENV_FILE }}
          APP_NETWORK: ${{ env.APP_NETWORK }}
          APP_UPLOAD_DIR: ${{ env.APP_UPLOAD_DIR }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_PASS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE,APP_CONTAINER,APP_ENV_FILE,APP_NETWORK,APP_UPLOAD_DIR,REGISTRY_URL,REGISTRY_USER,REGISTRY_PASS
          command_timeout: 15m
          script: |
            set -eu

            PREVIOUS_CONTAINER="${APP_CONTAINER}_previous"
            echo "${REGISTRY_PASS}" | docker login "${REGISTRY_URL}" -u "${REGISTRY_USER}" --password-stdin
            docker pull "${IMAGE}"

            # --- Thu muc du lieu luc chay -----------------------------------
            # Khong ep quyen va khong can root: tao thu muc neu chua co, roi cho
            # container chay bang dung uid/gid dang so huu no. Neu de container
            # chay bang user `node` (uid 1000) trong khi thu muc thuoc user khac
            # thi mkdirSync trong server/routes.upload.ts nem EACCES luc khoi dong.
            mkdir -p "${APP_UPLOAD_DIR}"
            RUN_UID="$(stat -c %u "${APP_UPLOAD_DIR}")"
            RUN_GID="$(stat -c %g "${APP_UPLOAD_DIR}")"
            echo "uploads: ${APP_UPLOAD_DIR} (uid=${RUN_UID} gid=${RUN_GID})"

            # --- Migration chạy TRƯỚC khi đụng container đang phục vụ --------
            # Migration của đợt này thuần bổ sung (chỉ thêm bảng mới) nên bản đang
            # chạy không bị ảnh hưởng trong lúc áp. Hỏng thì dừng tại đây, chưa ai
            # bị gián đoạn.
            echo "== Áp migration =="
            if ! docker run --rm \
              --network "${APP_NETWORK}" \
              --env-file "${APP_ENV_FILE}" \
              "${IMAGE}" \
              npx prisma migrate deploy --schema db/schema.prisma; then
              echo "-------------------------------------------------------------"
              echo "Migration that bai. Neu loi la P3005 (schema khong rong) thi"
              echo "day la CSDL dung truoc khi du an dung Prisma. Chay MOT LAN:"
              echo ""
              echo "  docker run --rm --network ${APP_NETWORK} \\"
              echo "    --env-file ${APP_ENV_FILE} ${IMAGE} \\"
              echo "    npx prisma migrate resolve --applied 0_baseline \\"
              echo "    --schema db/schema.prisma"
              echo ""
              echo "roi chay lai workflow. Container dang phuc vu chua bi dung."
              echo "-------------------------------------------------------------"
              exit 1
            fi

            docker rm -f "${PREVIOUS_CONTAINER}" 2>/dev/null || true
            if docker container inspect "${APP_CONTAINER}" >/dev/null 2>&1; then
              docker stop "${APP_CONTAINER}"
              docker rename "${APP_CONTAINER}" "${PREVIOUS_CONTAINER}"
            fi

            rollback() {
              docker rm -f "${APP_CONTAINER}" 2>/dev/null || true
              if docker container inspect "${PREVIOUS_CONTAINER}" >/dev/null 2>&1; then
                docker rename "${PREVIOUS_CONTAINER}" "${APP_CONTAINER}"
                docker start "${APP_CONTAINER}"
              fi
            }

            if ! docker run -d \
              --name "${APP_CONTAINER}" \
              --network "${APP_NETWORK}" \
              --restart unless-stopped \
              --env-file "${APP_ENV_FILE}" \
              -v "${APP_UPLOAD_DIR}:/app/public/uploads" \
              --user "${RUN_UID}:${RUN_GID}" \
              -e HOME=/tmp \
              --label "com.bnsc.git-sha=${{ github.sha }}" \
              "${IMAGE}"; then
              rollback
              exit 1
            fi

            # Cổng kiểm tra là /health/ready (có truy vấn CSDL), không phải
            # /health/live — nếu chỉ kiểm tra tiến trình còn sống thì một bản deploy
            # thiếu migration vẫn "xanh" trong khi mọi API nội dung trả 500.
            HEALTHY=false
            for attempt in $(seq 1 30); do
              STATE="$(docker inspect -f '{{.State.Status}}' "${APP_CONTAINER}" 2>/dev/null || echo missing)"
              if [ "${STATE}" = "exited" ] || [ "${STATE}" = "dead" ] || [ "${STATE}" = "missing" ]; then
                echo "Container đã dừng hẳn (trạng thái: ${STATE}) — không chờ thêm."
                break
              fi
              if [ "${STATE}" = "running" ] && docker exec "${APP_CONTAINER}" node -e \
                "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
                HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "${HEALTHY}" != "true" ]; then
              docker logs --tail=200 "${APP_CONTAINER}" || true
              rollback
              exit 1
            fi

            docker exec caddy caddy validate --config /etc/caddy/Caddyfile
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile
            docker ps --filter "name=^/${APP_CONTAINER}$"
