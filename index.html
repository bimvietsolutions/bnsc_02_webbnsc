<!doctype html>
<html lang="%BRAND_LANG%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="%BRAND_THEME_COLOR%" />

    <title>%BRAND_TITLE%</title>
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta name="author" content="%BRAND_NAME%" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%BRAND_SITE_URL%/" />

    <!-- Open Graph mặc định (fallback cho crawler không chạy JS) -->
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%BRAND_TITLE%" />
    <meta property="og:description" content="%BRAND_OG_DESCRIPTION%" />
    <meta property="og:url" content="%BRAND_SITE_URL%/" />
    <meta property="og:image" content="%BRAND_SITE_URL%%BRAND_LOGO%" />
    <meta property="og:locale" content="%BRAND_LOCALE%" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="%BRAND_FAVICON_TYPE%" href="%BRAND_FAVICON%" />
    <link rel="apple-touch-icon" href="%BRAND_FAVICON%" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
